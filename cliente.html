<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi historial</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F4F5;--sf:#fff;--ink:#141214;--mu:#625C60;--ln:#D8D3D5;--br:#7A1530;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121012;--sf:#1D191B;--ink:#F1EDEF;--mu:#A39CA0;--ln:#352E31;--br:#E0617F;--on:#141214;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 14px 40px}
h1{font:700 32px/1.05 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px}
h2{font:700 20px "Barlow Condensed",Impact,sans-serif;margin:18px 0 6px}
input,button{font:inherit;color:inherit;border-radius:8px;padding:12px}
input{width:100%;background:var(--sf);border:1px solid var(--ln);font-size:22px;text-transform:uppercase;letter-spacing:2px}
button{background:var(--br);color:var(--on);border:0;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-top:14px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px}
.bar{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--br)}
.h{border-top:1px solid var(--ln);padding:8px 0}
</style>
</head>
<body>
<main>
<h1 id="nm">Mi historial</h1>
<p class="mu">Escribí tu patente para ver tu historial y tu próximo service.</p>
<input id="p" placeholder="ABC123" autocomplete="off" maxlength="8">
<button id="go">Consultar</button>
<div id="r"></div>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{firebaseConfig}from"./config.js";
const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleDateString('es-AR'),nk=n=>(+n||0).toLocaleString('es-AR');
let cfg={name:'Mi taller',rewardN:5,reward:''};
getDoc(doc(db,'cfg','main')).then(s=>{if(s.exists()){cfg=Object.assign(cfg,s.data());$('nm').textContent=cfg.name}}).catch(()=>{});
async function go(){
  const pl=$('p').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(pl.length<6){$('r').innerHTML='<div class="card">Escribí la patente completa.</div>';return}
  $('r').innerHTML='<div class="card mu">Buscando…</div>';
  try{
    const s=await getDoc(doc(db,'public',pl));
    if(!s.exists()){$('r').innerHTML='<div class="card">No encontramos esa patente. Consultá en el taller.</div>';return}
    const v=s.data(),N=+cfg.rewardN||5,c=v.scount||0,done=c%N,won=c>0&&done===0,k=won?N:done;
    $('r').innerHTML=`<div class="card"><b>${esc(v.car)}</b> · ${esc(v.plate)}
    <h2>Tu premio</h2><b>Vas ${k} de ${N} services</b><div class="bar"><i style="width:${k/N*100}%"></i></div>
    <div class="mu">${won?'¡Ganaste el premio! ':'Faltan '+(N-done)+'. '}${esc(cfg.reward)}</div>
    ${v.nk?`<h2>Próximo service</h2><div>Alrededor de los <b>${nk(v.nk)} km</b>, hacia el ${fd(v.due)}.</div>`:''}
    <h2>Historial</h2>${[...(v.jobs||[])].reverse().map(j=>`<div class="h"><div class="row"><b>${esc(j.type)} · ${nk(j.km)} km</b><span class="mu">${fd(j.date)}</span></div><div class="mu">${j.type==='Service'?esc(['Aceite '+(j.visc||'')+' '+(j.prod||''),...(j.filters||[]).map(f=>'filtro de '+f)].join(', ')):''} ${esc(j.notes)}</div></div>`).join('')}</div>`;
  }catch(e){$('r').innerHTML='<div class="card">No se pudo consultar. Probá de nuevo en un momento.</div>'}
}
$('go').onclick=go;$('p').onkeydown=e=>{if(e.key==='Enter')go()};
</script>
</body>
</html>
